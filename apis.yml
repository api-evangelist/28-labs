name: 28 labs
description: >-
  28labs Inc. operates She's Well (sheswell.co), a consumer fertility-care platform
  that bundles egg freezing, fertility testing, IVF coordination, clinic visits, labs,
  medications, and concierge nurse support into a single transparent subscription plan
  starting at $249/month over up to 60 months. The company was surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network. It is a business-to-consumer
  digital-health service with no public developer platform, API, SDKs, or developer
  documentation at this time; this profile captures its identity and domain-security posture.
